# CI: hermetic checks. No microphone, no GPU, no model download required.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Плагин лежит в подпапке voice-opencode-plugin/, а .github/ — в корне репозитория.
    defaults:
      run:
        working-directory: voice-opencode-plugin
    steps:
      - uses: actions/checkout@v4

      # --experimental-strip-types (npm test) появился в Node 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: voice-opencode-plugin/package-lock.json

      - name: Установить зависимости
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-зависимости
        run: python -m pip install --upgrade pip && pip install -r stt-server/requirements-dev.txt

      - name: Поставка bundle согласована с исходниками
        run: bash sync-plugin.sh --check

      - name: Типы
        run: npm run typecheck

      - name: Тесты плагина
        run: node --experimental-strip-types --test

      - name: Тесты STT-сервера
        run: python -m pytest -q

      - name: Синтаксис расширения
        run: |
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/tts.js

      - name: Манифест расширения согласован
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            const tts = fs.readFileSync("extension/tts.js", "utf8");
            const content = fs.readFileSync("extension/content.js", "utf8");
            // content.js печатает версию в рантайме: "content.js v" + TTS_VERSION + " loaded",
            // поэтому литерала с цифрами в нём нет — сверяем источник TTS_VERSION.
            const hits = [...tts.matchAll(/TTS_VERSION\s*=\s*"([0-9.]+)"/g)].map(x => x[1]);
            if (!hits.length) throw new Error("в tts.js нет TTS_VERSION");
            for (const v of hits) {
              if (v !== m.version) throw new Error("расхождение версий: manifest " + m.version + " vs tts.js TTS_VERSION " + v);
            }
            if (!content.includes("content.js v")) throw new Error("content.js больше не печатает строку content.js v... loaded");
            const match = JSON.stringify(m.content_scripts[0].matches);
            if (match.includes("all_urls")) throw new Error("<all_urls> вернулся в content_scripts.matches");
            console.log("manifest " + m.version + " OK, tts.js TTS_VERSION " + hits[0] + " OK, matches " + match);
          '
